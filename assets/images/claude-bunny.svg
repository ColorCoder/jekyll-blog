<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="A drawing of a plush bunny sitting under a night sky with a crescent moon and stars">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2340"/>
      <stop offset="1" stop-color="#3b3358"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6d9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6d9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="18" fill="url(#sky)"/>
  <!-- moon -->
  <circle cx="470" cy="90" r="70" fill="url(#glow)"/>
  <circle cx="470" cy="90" r="34" fill="#f6e3bd"/>
  <circle cx="486" cy="80" r="30" fill="#252645"/>
  <!-- stars -->
  <g fill="#f6e3bd">
    <circle cx="80" cy="60" r="2.5"/><circle cx="150" cy="110" r="1.8"/><circle cx="230" cy="50" r="2.2"/>
    <circle cx="330" cy="95" r="1.6"/><circle cx="390" cy="40" r="2"/><circle cx="545" cy="170" r="1.8"/>
    <circle cx="60" cy="170" r="1.6"/><circle cx="560" cy="45" r="2.2"/>
    <path d="M300 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>
  <!-- ground / blanket -->
  <path d="M0 330 Q150 300 300 318 T600 312 V400 H0 Z" fill="#c9837a"/>
  <path d="M0 352 Q170 330 320 342 T600 336 V400 H0 Z" fill="#b5532f" opacity="0.55"/>
  <!-- bunny -->
  <g stroke="#6e4a48" stroke-width="3" stroke-linejoin="round">
    <!-- ears -->
    <path d="M262 150 C238 70 250 30 268 34 C288 38 288 100 282 150 Z" fill="#e7b9b2"/>
    <path d="M318 150 C330 90 352 44 368 54 C384 66 356 120 334 156 Z" fill="#e7b9b2"/>
    <path d="M266 140 C252 86 258 54 268 52 C278 56 278 104 276 140 Z" fill="#f3d6d0" stroke="none"/>
    <path d="M324 144 C334 100 350 70 360 74 C368 82 350 116 334 146 Z" fill="#f3d6d0" stroke="none"/>
    <!-- body -->
    <ellipse cx="300" cy="275" rx="78" ry="62" fill="#e7b9b2"/>
    <!-- head -->
    <ellipse cx="300" cy="190" rx="60" ry="52" fill="#e7b9b2"/>
    <!-- paws -->
    <ellipse cx="262" cy="328" rx="26" ry="14" fill="#efc9c2"/>
    <ellipse cx="338" cy="328" rx="26" ry="14" fill="#efc9c2"/>
    <!-- arms hugging a heart -->
    <path d="M300 300 C276 284 270 262 286 256 C294 253 300 260 300 264 C300 260 306 253 314 256 C330 262 324 284 300 300 Z" fill="#b5532f" stroke="#7a2f1a"/>
    <path d="M240 268 C252 292 270 300 284 296" fill="none"/>
    <path d="M360 268 C348 292 330 300 316 296" fill="none"/>
  </g>
  <!-- face -->
  <g stroke="#4a3130" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M272 186 q8 7 16 0"/>
    <path d="M312 186 q8 7 16 0"/>
    <path d="M294 208 q6 5 12 0"/>
  </g>
  <ellipse cx="300" cy="202" rx="6" ry="4.5" fill="#b5605a"/>
  <circle cx="266" cy="204" r="9" fill="#f0a6a0" opacity="0.6"/>
  <circle cx="334" cy="204" r="9" fill="#f0a6a0" opacity="0.6"/>
  <!-- fuzzy texture dots -->
  <g fill="#d9a59d" opacity="0.7">
    <circle cx="262" cy="250" r="2"/><circle cx="340" cy="245" r="2"/><circle cx="330" cy="310" r="2"/>
    <circle cx="270" cy="312" r="2"/><circle cx="252" cy="172" r="2"/><circle cx="346" cy="170" r="2"/>
  </g>
</svg>
